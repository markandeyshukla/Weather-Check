<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="prime-div">
        <div class="main-div">
            <div class="first-div">
                <div class="search-div">
                    <h1>Weather</h1>
                    <p>Get real-time weather updates for any location</p>
                    <div>
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="city">
                        <button id="btn">Check</button>
                    </div>
                </div>
                <div class="img-div">
                    <img id="icon-top" alt="">
                    <h2>Check Weather</h2>
                </div>
            </div>
            <div class="weather-main">
                <div class="current-weather">
                    <div class="left-side-cur">
                        <div class="temp-img">
                            <i class="fa-solid fa-location-dot modify"></i>
                            <span id="name">City: </span>
                            <span class="state">State: </span>
                            <span id="country">Country: </span>
                        </div>
                        <div class="temp-img">
                            <span id="days"></span>
                            <span id="dates"></span>
                        </div>
                        <div class="temp-img">
                            <span class="tempe">Temperature: </span>
                            <img id="icon" alt="">
                        </div>
                        <div class="temp-img temper">
                            <span id="condition" class=""></span><br>
                            <span id="feelslike" class="">Feelslike: </span>
                        </div>
                    </div>
                    <div class="right-side-cur">
                       <div class="right-side-sun">
                         <img class="right-side-img" src="https://cdn-icons-png.flaticon.com/512/8179/8179067.png"
                            alt="">
                            <div>
                            <span>
                                <em class="sunfont">Sunrise:</em>
                            </span>    
                        <p id="sunrise" class="right-side-p sunfont">sunrise</p>
                            </div>
                       </div>
                        <hr>
                        <div class="right-side-sun">
                            
                        <img class="right-side-img" src="https://cdn-icons-png.flaticon.com/512/3236/3236899.png"
                            alt="">
                            <div>
                                <span><em class="sunfont">Sunset:</em></span>
                        <p id="sunset" class="right-side-p sunfont">sunset</p>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="condition-weather">
                    <div class="box">
                        <i class="fa-solid fa-temperature-high"></i>
                        <div>
                            <span class="font">Temparature:</span>
                            <span class=" tempf tempe">Temperature: </span>
                        </div>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-droplet"></i>
                        <div>
                            <span class="font">Humidity:</span>
                            <span id="humidity" class="tempf">Humidity: </span>
                        </div>
                    </div>
                    <div class="box">
                     <i class="fa-solid fa-wind"></i>
                        <div>
                            <span class="font">Wind:</span>
                            <span id="wind" class="tempf">Wind Speed: </span>
                        </div>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <div>
                            <span class="font">State: </span>
                            <span class="state tempf">State: </span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="container"></div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
